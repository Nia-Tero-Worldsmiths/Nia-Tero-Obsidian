# Provenance for the artwork in z_Assets/.
#
# The images here come from different places and each needs a different answer. 
# The site's text is CC BY-SA 4.0. No image is covered by that, and none will
# be until its row below says so explicitly. A Creative Commons grant cannot be
# withdrawn once made, so "reserved" is the safe default: it can always be
# opened later, never closed again.
#
# FIELDS
#
#   origin    original | ai | licensed | external | unknown   (required)
#               original -- drawn by a member of the team
#               ai       -- generative output
#               licensed -- someone else's, under terms that let us publish
#               external -- someone else's, with no permission to publish
#               unknown  -- not yet established
#   author    who made it. Only meaningful for `origin: original`.
#   license   overrides the default below. Add one only when it differs.
#             REQUIRED for `origin: licensed` -- that origin means nothing
#             without naming the terms it relies on.
#   source    where it came from, as a URL or a plain description.
#             REQUIRED for `origin: licensed`, so the claim can be rechecked.
#

version: 1

# Whether a file may be copied to the public site, by origin.
policy:
  original: publish   # ours to show
  ai:       publish   # showable, but see `defaults.license`
  licensed: publish   # someone else's, but the terms allow it
  external: never     # someone else's work -- vault-only reference
  unknown:  never     # unclassified is not a licence to publish

# Applied to any row that does not say otherwise, and to any file with no row.
defaults:
  origin: unknown
  license: reserved


